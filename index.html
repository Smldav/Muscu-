<style>
:root{
  --bg:#E9EAE6; --surface:#F7F7F4; --ink:#17191C; --muted:#5E646B; --line:#CDD0CB;
  --accent:#1F4BFF; --accent-ink:#FFFFFF; --ok:#1E8A46; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121416; --surface:#1C1F22; --ink:#ECEDEA; --muted:#9AA0A6; --line:#2E3236;
    --accent:#6C8CFF; --accent-ink:#0B0F1A; --ok:#4CC27A; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#121416; --surface:#1C1F22; --ink:#ECEDEA; --muted:#9AA0A6; --line:#2E3236;
  --accent:#6C8CFF; --accent-ink:#0B0F1A; --ok:#4CC27A; --danger:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:84px;
}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;font-size:40px;line-height:1;margin:4px 0 18px;letter-spacing:.01em}
h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;font-size:26px;line-height:1.1;margin:0 0 10px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.btn{
  font:inherit;font-weight:600;min-height:46px;padding:0 18px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.tab:focus-visible,.check:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.gap{margin-top:12px}
label{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],select{
  font:inherit;width:100%;min-height:46px;padding:0 12px;border-radius:8px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
.exrow{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.exrow:first-of-type{border-top:0;margin-top:0;padding-top:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 18px 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.setrow .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.setrow .x{text-align:center;color:var(--muted)}
.check{
  width:48px;height:46px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;
  color:var(--ink);font-size:22px;cursor:pointer;line-height:1;
}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.target{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 6px;border-radius:5px;font-weight:700;font-size:13px;border:1px solid rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;height:110px;margin:12px 0 6px}
.bar .end{width:26px;height:10px;background:#8b9096;border-radius:2px 0 0 2px}
.bar .pl{width:14px;margin-right:2px;border-radius:2px;border:1px solid rgba(0,0,0,.3)}
.bar .sleeve{width:36px;height:12px;background:#8b9096;margin-left:0;border-radius:0 2px 2px 0}
.result{border-left:4px solid var(--accent);padding:6px 0 6px 12px;margin-top:12px}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;line-height:1.05}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:14px}
.err{color:var(--danger);font-weight:500;margin-top:10px}
.okmsg{color:var(--ok);font-weight:600}
details.tech{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.tech summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details.tech p{font-size:14px;margin:8px 0 0}
.btn:disabled{opacity:.4;cursor:default}
.exph{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.exph img{width:100%;height:auto;border-radius:6px;background:var(--bg);display:block}
details.tech a{color:var(--accent);font-weight:600}
.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;
}
.tab{
  flex:1;font:inherit;font-weight:600;background:none;border:0;border-top:3px solid transparent;
  min-height:56px;color:var(--muted);cursor:pointer;
}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.plates-set{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.plates-set label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:15px}
.plates-set input{width:20px;height:20px}
@media (prefers-reduced-motion: no-preference){.check{transition:background .12s}}

<script>
const KEY='muscu-v1';
const VERSION='3';
const ALL_PLATES=[25,20,15,10,5,2.5,1.25];
const PCOL={25:'#D6282F',20:'#1F5BD6',15:'#E8C21A',10:'#1E9E4A',5:'#F2F2F2',2.5:'#26292D',1.25:'#A9AEB3'};

const PH={25:100,20:92,15:82,10:70,5:58,2.5:48,1.25:40};
const MODES={barre:'Barre',haltere:'Haltères (charge par haltère)',machine:'Machine ou poulie',pc:'Poids du corps (lest)'};

/* ---------- Programmes de départ (source : ton fichier Excel, feuille « Séances Entraînement ») ---------- */

  desc:"Barre sur les trapèzes (pas la nuque). Descendre jusqu'à cuisses parallèles au sol. Genoux dans l'axe des pieds. Dos gainé, regard devant. Pousser sur les talons.",

/* ---------- Images d'exemple (free-exercise-db, domaine public) ---------- */
const IMG_BASE='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
/* Identifiants candidats par exercice : l'app essaie dans l'ordre et affiche le premier qui charge. */
const IMGS={
 'Développé couché barre':['Barbell_Bench_Press_-_Medium_Grip'],
 'Développé incliné haltères':['Incline_Dumbbell_Press'],
 'Élévations latérales haltères':['Side_Lateral_Raise'],
 'Développé militaire haltères':['Dumbbell_Shoulder_Press','Standing_Dumbbell_Press','Seated_Dumbbell_Press'],
 'Dips (lestés si possible)':['Dips_-_Triceps_Version','Dips_-_Chest_Version'],
 'Extensions triceps poulie haute':['Triceps_Pushdown_-_Rope_Attachment','Triceps_Pushdown'],
 'Tractions':['Pullups','Wide-Grip_Rear_Pull-Up'],
 'Rowing barre':['Bent_Over_Barbell_Row'],
 'Tirage horizontal poulie':['Seated_Cable_Rows'],
 'Curl barre':['Barbell_Curl'],
 'Curl marteau haltères':['Hammer_Curls'],
 'Curl incliné haltères':['Incline_Dumbbell_Curl','Alternate_Incline_Dumbbell_Curl'],
 'Dips prise serrée (triceps)':['Dips_-_Triceps_Version'],
 'Kickback haltères':['Tricep_Dumbbell_Kickback'],
 'Squat barre':['Barbell_Full_Squat','Barbell_Squat'],
 'Presse à cuisses':['Leg_Press'],
 'Soulevé de terre roumain (RDL)':['Romanian_Deadlift'],
 'Fentes marchées haltères (reps par jambe)':['Dumbbell_Lunges','Bodyweight_Walking_Lunge','Barbell_Walking_Lunge'],
 'Leg curl allongé':['Lying_Leg_Curls'],
 'Extensions mollets':['Standing_Calf_Raises','Seated_Calf_Raise']
};
const imgOK={};
function loadExample(i){
  if(!session) return;
  const box=document.querySelector('.eximg[data-i="'+i+'"]');
  if(!box) return;
  const it=session.items[i], ids=it.imgs||[], key=ids.join('|');
  const vid='https://www.youtube.com/results?search_query='+encodeURIComponent(it.name+' technique musculation');
  const show=id=>{
    if(!box.isConnected) return;
    box.innerHTML = id
      ? `<div class="exph"><img alt="${esc(it.name)}, position de départ" src="${IMG_BASE}${id}/0.jpg"><img alt="${esc(it.name)}, position d'arrivée" src="${IMG_BASE}${id}/1.jpg" onerror="this.remove()"></div><p class="muted small">Exemple : ${esc(id.replace(/_/g,' '))}. Images : free-exercise-db (domaine public).</p>`
      : `<p class="muted small">Image indisponible (hors connexion ou introuvable).</p>`;
  };
  if(!ids.length){box.innerHTML='<p class="muted small">Pas d\'image pour cet exercice.</p>';return;}
  if(key in imgOK){show(imgOK[key]);return;}
  box.innerHTML='<p class="muted small">Chargement de l\'image…</p>';
  let k=0;
  const next=()=>{
    if(k>=ids.length){imgOK[key]=null;show(null);return;}
    const id=ids[k++], im=new Image();
    im.onload=()=>{imgOK[key]=id;show(id);};
    im.onerror=next;
    im.src=IMG_BASE+id+'/0.jpg';
  };
  next();
}

/* ---------- Données ---------- */
function defaults(){return {programs:[],history:[],seeded:false,settings:{bar:20,step:2.5,plates:ALL_PLATES.slice()}};}
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const d=JSON.parse(r), df=defaults();
      return {programs:d.programs||[],history:d.history||[],seeded:!!d.seeded,settings:Object.assign(df.settings,d.settings||{})};
    }
  }catch(e){}
  return defaults();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){
  S.programs=INIT.map(p=>({id:uid(),name:p.name,exercises:p.exercises.map(e=>Object.assign({id:uid(),weight:''},e))}));
  S.seeded=true;save();
}

let S=load();
if(!S.seeded && S.programs.length===0) seed();
let tab='seances', editing=null, session=null, summary=null, confirmHist=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const fmt=n=>(Math.round(n*100)/100).toString().replace('.',',');
const repsMax=s=>{const m=String(s==null?'':s).match(/\d+/g);return m?Math.max(...m.map(Number)):1;};

/* ---------- Calculs ---------- */
function platesFor(target){
  const bar=S.settings.bar;
  if(target<=0) return {plates:[],total:0,rest:0};
  if(target<bar) return {error:'La charge est inférieure à la barre ('+fmt(bar)+' kg).'};
  let rem=Math.round((target-bar)/2*100);
  const avail=S.settings.plates.slice().sort((a,b)=>b-a);
  const plates=[];
  for(const p of avail){
    const pc=Math.round(p*100);
    while(rem>=pc){plates.push(p);rem-=pc;}
  }
  const loaded=plates.reduce((a,b)=>a+b,0);
  return {plates,total:bar+2*loaded,rest:rem*2/100};
}
function chips(list){
  if(!list.length) return '<span class="muted small">barre seule</span>';
  return list.map(p=>`<span class="chip" style="background:${PCOL[p]};color:${PTXT[p]}">${fmt(p)}</span>`).join('');
}
function barVisual(list){
  const pl=list.slice().map(p=>`<span class="pl" style="height:${PH[p]}%;background:${PCOL[p]}"></span>`).join('');
  return `<div class="bar" aria-hidden="true"><span class="end"></span>${pl}<span class="sleeve"></span></div>`;
}
function weightText(mode,w){
  const n=num(w);
  if(mode==='pc') return n>0?'lest '+fmt(n)+' kg':'poids du corps';
  if(n<=0) return 'charge à définir';
  return fmt(n)+' kg'+(mode==='haltere'?' par haltère':'');
}

function sumLabel(it,w){
  if(it.mode==='pc') return w>0?fmt(w)+' kg de lest':'poids du corps';
  return fmt(w)+' kg'+(it.mode==='haltere'?' par haltère':'');
}
function viewSummary(){
  let h='<h1>Séance enregistrée</h1>';
  if(!summary.items.length) h+='<div class="card"><p>Aucun exercice validé.</p></div>';
  for(const it of summary.items){
    h+=`<div class="card"><h2>${esc(it.name)}</h2>`;
    if(it.ok){
      h+=`<p>Toutes les séries validées (${esc(it.sets)} × ${esc(it.reps)}) : ${esc(sumLabel(it,it.from))}.</p><p><strong>Suggestion : ${esc(sumLabel(it,it.to))}</strong> à la prochaine séance.</p>`;
      h+= it.applied ? '<p class="okmsg">Appliqué au programme.</p>' : (it.exId ? `<button class="btn primary" data-action="apply" data-ex="${it.exId}">Appliquer au programme</button>` : '<p class="muted small">Exercice ajouté pendant la séance, non lié au programme.</p>');
    } else if(it.hasStep){
      h+=`<p>Objectif pas atteint sur toutes les séries : garde ${esc(sumLabel(it,it.from))} et vise ${esc(it.goal)} reps sur chaque série.</p>`;
    } else {
      h+='<p>Pas de pas de progression défini pour cet exercice. Tu peux en ajouter un dans « Modifier » du programme.</p>';
    }
    h+='</div>';
  }
  h+='<p class="muted small">Règle utilisée (simplification) : toutes les séries prévues faites, à la même charge, avec le nombre de reps visé atteint, donne la charge + le pas de l\'exercice. Les pas viennent de ton Excel. Le nombre de reps visé est le haut de la fourchette, sauf mention contraire.</p>';
  h+='<button class="btn block" data-action="closesum">Fermer</button>';
  return h;
}

function calcMax(){
  const w=num(document.getElementById('m-w').value), r=Math.round(num(document.getElementById('m-r').value));
  const out=document.getElementById('m-out');
  if(w<=0||r<1){out.innerHTML='';return;}
  const ep=r===1?w:w*(1+r/30);
  const br=r===1?w:(r<37?w*36/(37-r):null);
  if(br===null){out.innerHTML='<p class="err">Trop de répétitions pour la formule de Brzycki.</p>';return;}
  const avg=(ep+br)/2;
  let h=`<div class="result"><div class="big">${fmt(avg)} kg</div><div class="muted small">Moyenne de deux formules. Epley : ${fmt(ep)} kg, Brzycki : ${fmt(br)} kg.</div></div>`;
  h+='<table><tr><th>% de la charge max</th><th>Charge</th></tr>';
  for(const pc of [95,90,85,80,75,70,65,60]) h+=`<tr><td>${pc} %</td><td>${fmt(avg*pc/100)} kg</td></tr>`;
  h+='</table><p class="muted small gap">Estimation : ces formules sont moins précises quand le nombre de répétitions augmente.</p>';
  out.innerHTML=h;
}
function calcProg(){
  const w=num(document.getElementById('p-w').value), t=Math.round(num(document.getElementById('p-t').value)), f=document.getElementById('p-f').value;
  const out=document.getElementById('p-out');
  if(w<=0||t<1||f===''){out.innerHTML='';return;}
  const worst=Math.round(num(f)), step=S.settings.step;
  out.innerHTML = worst>=t
    ? `<div class="result"><div class="big">${fmt(w+step)} kg</div><div class="muted small">Reps visées atteintes sur toutes les séries : charge + ${fmt(step)} kg (hypothèse de progression simple).</div></div>`
    : `<div class="result"><div class="big">${fmt(w)} kg</div><div class="muted small">Garde la charge et vise ${t} reps sur chaque série.</div></div>`;
}
function calcPlates(){
  const v=document.getElementById('c-t').value, out=document.getElementById('c-out');
  const t=num(v);
  if(t<=0){out.innerHTML='';return;}
  const r=platesFor(t);
  if(r.error){out.innerHTML=`<p class="err">${esc(r.error)}</p>`;return;}
  let h=barVisual(r.plates)+`<div class="chips">${chips(r.plates)}</div><p class="small gap">Par côté, de l'intérieur vers l'extérieur. Charge réalisée : <strong>${fmt(r.total)} kg</strong>.</p>`;
  if(r.rest>0) h+=`<p class="err">${fmt(r.rest)} kg ne peuvent pas être chargés avec les disques sélectionnés.</p>`;
  out.innerHTML=h;
}
function refreshTools(){
  if(tab!=='outils') return;
  calcMax();calcProg();calcPlates();
}

/* ---------- Rendu ---------- */
function updatePlateLine(i){
  const el=document.getElementById('pl-'+i);
  if(!el||!session) return;
  const it=session.items[i];
  if(it.mode==='barre'){
    const w=num(it.sets[0].w), r=platesFor(w);
    el.innerHTML = w>0&&!r.error
      ? `<span class="muted small">Par côté :</span>${chips(r.plates)}`
      : '<span class="muted small">Saisis la charge totale, barre comprise.</span>';
  } else if(it.mode==='haltere') el.innerHTML='<span class="muted small">Charge par haltère (kg)</span>';
  else if(it.mode==='pc') el.innerHTML='<span class="muted small">Lest en kg (0 = poids du corps)</span>';
  else el.innerHTML='<span class="muted small">Charge (kg)</span>';
}
function render(scroll){
  document.querySelectorAll('.tab').forEach(b=>{
    if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const app=document.getElementById('app');
  if(tab==='seances') app.innerHTML = summary?viewSummary():session?viewSession():editing?viewEditor():viewPrograms();
  else if(tab==='outils') app.innerHTML=viewTools();
  else app.innerHTML=viewHistory();
  if(tab==='seances'&&session&&!summary) session.items.forEach((_,i)=>{updatePlateLine(i);if(session.open.has('t-'+i)) loadExample(i);});
  if(scroll) window.scrollTo(0,0);
}

/* ---------- Actions ---------- */
function blankEx(){return {id:uid(),name:'',sets:'3',reps:'10',weight:'',mode:'machine',step:String(S.settings.step)};}
function startSession(p){
  session={programId:p.id,name:p.name,error:'',open:new Set(),adding:null,info:'',confirmRm:null,items:p.exercises.map(e=>{
    const n=Math.max(1,Math.round(num(e.sets))||1);
    return {exId:e.id,name:e.name,mode:e.mode||'machine',step:num(e.step),targetSets:n,repsLabel:String(e.reps),
      goal:Math.round(num(e.goal))||repsMax(e.reps),desc:e.desc||'',err:e.err||'',prog:e.prog||'',imgs:e.imgs||IMGS[e.name]||[],
      sets:Array.from({length:n},()=>({w:e.weight==null?'':String(e.weight),r:'',done:false}))};
  })};
}
function finishSession(){
  const entries=[],sumItems=[];
  const prog=S.programs.find(x=>x.id===session.programId);
  for(const it of session.items){
    const done=it.sets.filter(s=>s.done);
    if(!done.length) continue;
    entries.push({name:it.name,sets:done.map(s=>({w:num(s.w),r:Math.round(num(s.r))}))});
    const w0=num(done[0].w), wMin=Math.min(...done.map(s=>num(s.w)));
    const sameW=done.every(s=>num(s.w)===w0);
    const allDone=done.length>=it.targetSets;
    const allReps=done.every(s=>Math.round(num(s.r))>=it.goal);
    const ok=it.step>0&&allDone&&allReps&&sameW&&(it.mode==='pc'||wMin>0);
    sumItems.push({exId:it.exId,name:it.name,mode:it.mode,from:wMin,to:wMin+it.step,ok,hasStep:it.step>0,applied:false,reps:it.repsLabel,sets:it.targetSets,goal:it.goal});
    const ex=prog&&prog.exercises.find(x=>x.id===it.exId);
    if(ex) ex.weight=String(num(done[done.length-1].w));
  }
  if(!entries.length){session.error='Valide au moins une série avant de terminer.';return false;}
  S.history.unshift({id:uid(),date:new Date().toISOString(),programName:session.name,programId:session.programId,entries});
  save();
  summary={programId:session.programId,items:sumItems};
  session=null;
  return true;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(!b) return;
  const a=b.dataset.action;
  if(a==='tab'){
    tab=b.dataset.tab; confirmHist=null; render(true); refreshTools(); return;
  }
  if(a==='new'){editing={id:null,draft:{name:'',exercises:[blankEx()]},error:'',confirmDel:false};render(true);return;}
  if(a==='edit'){
    const p=S.programs.find(x=>x.id===b.dataset.id);
    editing={id:p.id,draft:JSON.parse(JSON.stringify(p)),error:'',confirmDel:false};render(true);return;
  }
  if(a==='cancel'){editing=null;render(true);return;}
  if(a==='addex'){editing.draft.exercises.push(blankEx());render();return;}
  if(a==='rmex'){editing.draft.exercises.splice(+b.dataset.i,1);render();return;}
  if(a==='saveprog'){
    const d=editing.draft;
    d.exercises=d.exercises.filter(x=>x.name.trim());
    if(!d.name.trim()){editing.error='Donne un nom au programme.';render();return;}
    if(!d.exercises.length){editing.error='Ajoute au moins un exercice avec un nom.';d.exercises=[blankEx()];render();return;}
    if(editing.id){const i=S.programs.findIndex(x=>x.id===editing.id);S.programs[i]={id:editing.id,name:d.name.trim(),exercises:d.exercises};}
    else S.programs.push({id:uid(),name:d.name.trim(),exercises:d.exercises});
    save();editing=null;render(true);return;
  }
  if(a==='delprog'){
    if(!editing.confirmDel){editing.confirmDel=true;render();return;}
    S.programs=S.programs.filter(x=>x.id!==editing.id);save();editing=null;render(true);return;
  }
  if(a==='start'){startSession(S.programs.find(x=>x.id===b.dataset.id));render(true);return;}
  if(a==='abort'){session=null;render(true);return;}
  if(a==='toggle'){
    const it=session.items[+b.dataset.i],s=it.sets[+b.dataset.s];
    if(!s.done){
      if(num(s.r)<=0){session.error='Saisis les répétitions avant de valider la série.';render();return;}
      if(it.mode!=='pc'&&String(s.w).trim()===''){session.error='Saisis la charge avant de valider la série.';render();return;}
    }
    session.error='';s.done=!s.done;render();return;
  }
  if(a==='addset'){
    const it=session.items[+b.dataset.i],last=it.sets[it.sets.length-1];
    it.sets.push({w:last.w,r:'',done:false});render();return;
  }
  if(a==='upex'||a==='downex'){
    const i=+b.dataset.i,j=a==='upex'?i-1:i+1,arr=editing.draft.exercises;
    if(j>=0&&j<arr.length){const t=arr[i];arr[i]=arr[j];arr[j]=t;}
    render();return;
  }
  if(a==='mvitem'){
    const i=+b.dataset.i,j=i+(+b.dataset.d),arr=session.items;
    if(j>=0&&j<arr.length){const t=arr[i];arr[i]=arr[j];arr[j]=t;
      const o=session.open,fix=k=>k;
      const keys=[...o];o.clear();
      keys.forEach(k=>{const p=k.slice(0,2),n=+k.slice(2);o.add(p+(n===i?j:n===j?i:n));});}
    render();return;
  }
  if(a==='rmset'){
    const it=session.items[+b.dataset.i];
    if(it.sets.length>1){it.sets.pop();it.targetSets=Math.min(it.targetSets,it.sets.length);}
    render();return;
  }
  if(a==='rmitem'){
    const i=+b.dataset.i;
    if(session.confirmRm!==i){session.confirmRm=i;render();return;}
    session.items.splice(i,1);session.confirmRm=null;session.open.clear();render();return;
  }
  if(a==='showadd'){session.adding={name:'',sets:'3',reps:'10',mode:'machine',error:''};render();return;}
  if(a==='canceladd'){session.adding=null;render();return;}
  if(a==='doadd'){
    const ad=session.adding;
    if(!ad.name.trim()){ad.error="Donne un nom à l'exercice.";render();return;}
    const nm=ad.name.trim(),n=Math.max(1,Math.round(num(ad.sets))||3),rp=ad.reps.trim()||'10';
    session.items.push({exId:null,name:nm,mode:ad.mode,step:S.settings.step,targetSets:n,repsLabel:rp,goal:repsMax(rp),
      desc:'',err:'',prog:'',imgs:IMGS[nm]||[],sets:Array.from({length:n},()=>({w:'',r:'',done:false}))});
    session.adding=null;render();return;
  }
  if(a==='keepstruct'){
    const prog=S.programs.find(x=>x.id===session.programId);
    if(!prog){session.info='Programme introuvable.';render();return;}
    const old=new Map(prog.exercises.map(x=>[x.id,x]));
    prog.exercises=session.items.map(it=>{
      let ex=it.exId&&old.get(it.exId);
      if(!ex){ex={id:uid(),name:it.name,weight:'',mode:it.mode,step:it.step?String(it.step):''};it.exId=ex.id;}
      ex.sets=String(it.sets.length);ex.reps=it.repsLabel;
      return ex;
    });
    save();session.info='Programme mis à jour.';render();return;
  }
  if(a==='finish'){finishSession();render(true);return;}
  if(a==='apply'){
    const it=summary.items.find(x=>x.exId===b.dataset.ex),p=S.programs.find(x=>x.id===summary.programId);
    const ex=p&&p.exercises.find(x=>x.id===it.exId);
    if(ex){ex.weight=String(it.to);save();}
    it.applied=true;render();return;
  }
  if(a==='closesum'){summary=null;render(true);return;}
  if(a==='delhist'){
    if(confirmHist!==b.dataset.id){confirmHist=b.dataset.id;render();return;}
    S.history=S.history.filter(x=>x.id!==b.dataset.id);confirmHist=null;save();render();return;
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pname'&&editing){editing.draft.name=t.value;return;}
  if(t.dataset.ex!==undefined&&editing){editing.draft.exercises[+t.dataset.ex][t.dataset.f]=t.value;return;}
  if(t.dataset.opt==='reps'&&session){const it=session.items[+t.dataset.i];it.repsLabel=t.value;it.goal=repsMax(t.value);return;}
  if(t.dataset.add&&session&&session.adding){session.adding[t.dataset.add]=t.value;return;}
  if(t.dataset.s!==undefined&&session){
    session.items[+t.dataset.i].sets[+t.dataset.s][t.dataset.f]=t.value;
    if(t.dataset.f==='w') updatePlateLine(+t.dataset.i);
    return;
  }
  if(t.dataset.tool){refreshTools();return;}
  if(t.dataset.set){
    const v=num(t.value);
    if(t.dataset.set==='bar'&&v>=0) S.settings.bar=v;
    if(t.dataset.set==='step'&&v>0) S.settings.step=v;
    save();refreshTools();return;
  }
  if(t.dataset.plate){
    const p=+t.dataset.plate,set=new Set(S.settings.plates);
    if(t.checked) set.add(p); else set.delete(p);
    S.settings.plates=ALL_PLATES.filter(x=>set.has(x));
    save();refreshTools();
  }
});

document.addEventListener('toggle',e=>{
  const d=e.target;
  if(!d||!d.dataset||!d.dataset.key||!session) return;
  if(d.open) session.open.add(d.dataset.key); else session.open.delete(d.dataset.key);
  if(d.open&&d.dataset.key.charAt(0)==='t') loadExample(+d.dataset.key.slice(2));
},true);

render(true);
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
</body>
</html>
